<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1920,initial-scale=1" />
<link rel="icon" href="data:,">
<title>微诗 · 一曲诗词 (poem-song-mv)</title>
<link rel="stylesheet" href="/resources/core/huaping-video.css">
<style>
  /* Two lines at most: the line being sung, large and solid; the one before, small and pale. */
  .lyric { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; letter-spacing: .12em;
    transform-origin: 50% 50%; }
  .lyric span { display: inline-block; }
  .lyric .gap { width: .8em; }
  .credit { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
    gap: .9em; color: var(--muted); letter-spacing: .14em; white-space: nowrap; }
  .credit .author { color: var(--accent); }
</style>
</head>
<body>
  <div id="stage">
    <div id="art-wrap">
      <canvas id="art"></canvas>
      <canvas id="weather" width="1080" height="1920"></canvas>
    </div>
    <div id="type"></div>
  </div>

<script src="/vendor/zxart/zxart-compose.js"></script>
<script src="/vendor/zxart/zxart-shanshui-v5.js"></script>
<script type="module">
  import { huapingClauses } from '/resources/core/huaping-layout.js';
  import { TYPE_FLOOR, byline, inkGlyphState, sealState, pushScale, easeOut, clamp, songTimeline } from '/resources/core/huaping-video.js';
  import { loadRecipe, planPainting, applyPalette, paintFrame, afterglowScene, sealElement, previewLoop } from '/resources/core/huaping-scene.js';
  import { drawAfterglow } from '/resources/core/huaping-afterglow.js';

  // A song in ink: the painting carries the music (ripples open on the beat), the sung line is the
  // one large thing on the page, and the line before it steps back, small and pale.
  const W = 1080, H = 1920;
  const { params, recipe, palettes } = await loadRecipe('sumuzhe-fanzhongyan-mv');
  window.RECIPE = recipe;
  const { title = '', author = '', dynasty = '' } = recipe;
  const lyrics = (recipe.lyrics || []).map(l => ({ start: Number(l.start), end: Number(l.end), clauses: huapingClauses(l.text), text: l.text }))
    .filter(l => l.clauses.length);
  if (!lyrics.length) throw new Error('配方缺少 lyrics');
  const poem = lyrics.map(l => l.text).join('');
  const lengths = lyrics.map(l => l.clauses.join('').length + (l.clauses.length - 1) * 0.6);

  const painting = planPainting({ poem, title, procedural: recipe.procedural, params, verseSide: 'top',
    verseColumns: 2, verseChars: Math.min(10, Math.ceil(Math.max(...lengths))) });
  const palette = applyPalette(palettes, recipe, params, painting);
  await document.fonts.load('100px SongReg');
  await document.fonts.ready;
  const frame = await paintFrame(document.getElementById('art'), painting, palette, { width: W, height: H });

  // The lyric box is the engine's verse box. The sung line is the one large thing: each clause on its
  // own row, all lines at one size, the largest the longest clause allows. The line before it comes
  // back as a single small pale row above; the credit sits under the sung line's rows.
  const r = frame.verse.rect;
  const box = { x: (r.x + r.width * 0.04) * W, y: (r.y + r.height * 0.03) * H, width: r.width * 0.92 * W, height: r.height * 0.94 * H };
  const longestClause = Math.max(...lyrics.flatMap(l => l.clauses.map(c => Array.from(c).length)));
  const rowsMax = Math.max(...lyrics.map(l => l.clauses.length));
  const large = Math.floor(Math.min(112, box.width / (longestClause * 1.12)));
  const small = Math.max(36, Math.round(large * 0.4));
  const creditSize = 30;
  const area = rowsMax * large * 1.25;
  // The block fills the verse box from its top: the box was lifted through bare paper, and the
  // engine painted nothing in it.
  const blockTop = box.y;
  const prevTop = blockTop;
  const currentTop = prevTop + small * 1.8;
  const creditTop = currentTop + area + creditSize * 0.35;
  window.WARNINGS = [large < 64 && `当前句字号 ${large}px 小于 64px`, small < 36 && `上一句字号 ${small}px 小于 36px`,
    small * 1.8 + area + creditSize * 1.95 > box.height && '歌词块高于诗句框'].filter(Boolean);

  const typeLayer = document.getElementById('type');
  const lyricBox = document.createElement('div');
  lyricBox.style.cssText = `position:absolute;left:${box.x}px;top:0;width:${box.width}px;height:${H}px`;
  typeLayer.appendChild(lyricBox);
  const span = (parent, text, className) => parent.appendChild(Object.assign(document.createElement('span'), { textContent: text, className: className || '' }));
  const lines = lyrics.map(l => {
    const big = document.createElement('div');
    big.className = 'lyric';
    big.style.cssText = `font-size:${large}px;line-height:${large * 1.25}px;top:${currentTop + (area - l.clauses.length * large * 1.25) / 2}px`;
    const glyphs = [];
    for (const clause of l.clauses) {
      const row = big.appendChild(document.createElement('div'));
      for (const ch of clause) glyphs.push(span(row, ch));
    }
    const back = document.createElement('div');
    back.className = 'lyric';
    back.style.cssText = `font-size:${small}px;line-height:${small * 1.3}px;top:${prevTop}px;color:var(--muted)`;
    l.clauses.forEach((clause, i) => { if (i) span(back, '', 'gap'); span(back, clause); });
    lyricBox.append(big, back);
    return { big, back, glyphs };
  });
  const credit = document.createElement('div');
  credit.className = 'credit';
  credit.style.cssText = `top:${creditTop}px;font-size:${creditSize}px;line-height:${creditSize * 1.6}px`;
  credit.innerHTML = '<span class="title"></span><span class="author"></span>';
  credit.querySelector('.title').textContent = title;
  credit.querySelector('.author').textContent = byline(dynasty, author);
  const seal = sealElement(creditSize * 0.9, creditSize * 0.9 * 354 / 173);
  credit.appendChild(seal);
  lyricBox.appendChild(credit);

  const song = songTimeline({ lyrics, glyphCounts: lines.map(l => l.glyphs.length) });
  window.DUR = Number(params.get('dur')) || Math.max(Math.ceil(Number(recipe.duration) || 0), Math.ceil(song.sealAt + 1));
  const pt = W / 393;

  window.EV = [
    { t: 0.2, sfx: 'qin-harmonic', gain: -9 },
    ...lyrics.map(l => ({ t: Number(l.start.toFixed(2)), sfx: 'bamboo-chime', gain: -12 })),
    { t: Number(song.sealAt.toFixed(2)), sfx: 'seal-stamp', gain: -4 },
  ];

  window.TEXTS = t => {
    const list = [{ id: 'credit', text: `${title} ${byline(dynasty, author)}` }];
    song.lines.forEach((line, i) => { if (t >= line.times[0] + 0.125 && t < line.end) list.push({ id: `lyric-${i + 1}`, text: lyrics[i].text }); });
    return list;
  };

  const bpm = Number(recipe.bpm) || 0;
  const scene = afterglowScene(frame, palette, { poem, title, term: recipe.term, motifs: painting.motifs,
    avoid: { x: box.x, y: blockTop, width: box.width, height: creditTop + creditSize * 2 - blockTop },
    seed: painting.art.seed, duration: window.DUR });
  // The beat drives the water: each ring opens on a beat (no beat given: free-running ripples).
  if (bpm > 0) scene.beat = 60 / bpm;
  window.SCENE = { brushwork:frame.brushwork, weatherBounds:frame.weatherBounds, anchors:frame.anchors, sceneElements:frame.sceneElements, scene: painting.scene, composition: painting.art.params.scene.composition, motifs: painting.motifs,
    palette: `${palette.id}/${palette.appearance}`, artHeight: frame.artHeight, weather: scene.weather,
    afterglow: scene.afterglow, box, large, small };
  const weatherCtx = document.getElementById('weather').getContext('2d');
  const artWrap = document.getElementById('art-wrap');
  const STEP = 0.5;

  window.render = t => {
    t = Math.max(0, Math.min(window.DUR, t));
    artWrap.style.transform = `scale(${pushScale(t, window.DUR).toFixed(5)})`;
    drawAfterglow(weatherCtx, t, scene);
    lines.forEach((line, i) => {
      const timing = song.lines[i];
      // The last line stays. Just before the next line is sung, this one dissolves upward and comes
      // back small and pale above; that small copy fades once another line steps back over it.
      const next = song.lines[i + 1];
      const back = next ? easeOut((t - (timing.end - 0.35)) / STEP) : 0;
      const gone = next && song.lines[i + 2] ? clamp((t - (next.end - 0.6)) / 0.3) : 0;
      line.big.style.visibility = t >= timing.times[0] && back < 1 ? 'visible' : 'hidden';
      line.big.style.opacity = (1 - back).toFixed(3);
      line.big.style.filter = back > 0.01 ? `blur(${(back * 10).toFixed(2)}px)` : 'none';
      line.big.style.transform = `translateY(${(-back * large * 0.3).toFixed(1)}px)`;
      const shown = clamp((back - 0.3) / 0.7) * (1 - gone);
      line.back.style.visibility = shown > 0 ? 'visible' : 'hidden';
      line.back.style.opacity = (shown * 0.62).toFixed(3);
      line.glyphs.forEach((g, j) => {
        const s = inkGlyphState(t, timing.times[j], 0.25, pt);
        g.style.opacity = s.opacity.toFixed(3);
        g.style.filter = s.blur > 0.05 ? `blur(${s.blur.toFixed(2)}px)` : 'none';
        g.style.transform = `scale(${s.scale.toFixed(4)})`;
      });
    });
    const c = easeOut((t - 0.3) / 0.6);
    credit.querySelectorAll('.title, .author').forEach(el => { el.style.opacity = c.toFixed(3); });
    const s = sealState(t, song.sealAt);
    seal.style.opacity = s.opacity.toFixed(3);
    seal.style.transform = `scale(${s.scale.toFixed(4)})`;
  };

  window.render(0);
  window.READY = true;
  previewLoop(document.getElementById('stage'), params);
</script>
</body>
</html>
