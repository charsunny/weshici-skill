<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1920,initial-scale=1" />
<link rel="icon" href="data:,">
<title>微诗 · 诗人行迹 (poet-footprint)</title>
<link rel="stylesheet" href="/resources/core/huaping-video.css">
<style>
  /* A map on paper, the route in seal colour (the only colour), and an inscription per station. */
  .leaf { position: absolute; left: 110px; right: 140px; text-align: center; }
  .verse div { white-space: nowrap; letter-spacing: .12em; }
  .verse span { display: inline-block; }
  .source, .context { white-space: nowrap; letter-spacing: .12em; color: var(--muted); }
  .source .author { color: var(--accent); }
  .city { position: absolute; white-space: nowrap; letter-spacing: .14em; transform: translateY(-50%); }
  .tick { position: absolute; text-align: center; white-space: nowrap; transform: translateX(-50%); line-height: 1.35; }
  .tick .year { letter-spacing: .04em; }
  .tick .event { color: var(--muted); letter-spacing: .1em; }
</style>
</head>
<body>
  <div id="stage">
    <div id="art-wrap">
      <canvas id="map" width="1080" height="1920"></canvas>
      <canvas id="route" width="1080" height="1920"></canvas>
    </div>
    <div id="type"></div>
  </div>

<script type="module">
  import { huapingClauses } from '/resources/core/huaping-layout.js';
  import { easeInOut } from '/resources/core/weishi-video-core.js';
  import { resolveVideoPalette, byline, inkGlyphState, pushScale, easeOut, clamp, leafGone } from '/resources/core/huaping-video.js';
  import { fitMap, routePath, routeUpTo, rulerLayout, GEOGRAPHY } from '/resources/core/footprint.js';
  import { loadRecipe, previewLoop } from '/resources/core/huaping-scene.js';

  const W = 1080, H = 1920;
  const { params, recipe, palettes } = await loadRecipe('sushi-footprint');
  window.RECIPE = recipe;
  const palette = resolveVideoPalette(palettes, { palette: params.get('palette') || recipe.palette,
    appearance: params.get('appearance') || recipe.appearance, term: recipe.term, date: recipe.date });
  for (const [slot, value] of Object.entries(palette.colors)) document.documentElement.style.setProperty(`--${slot}`, value);
  // The route is the seal's colour from the light palette, in both appearances.
  const vermilion = palettes.palettes[palette.id].light.seal;
  const { colors } = palette;
  const stations = recipe.stations;
  const events = recipe.events || [];
  window.DUR = Number(params.get('dur')) || Number(recipe.duration) || 20;
  await document.fonts.load('100px SongReg');
  await document.fonts.ready;

  // ---- layout (1080×1920; text stays clear of the platform's right 140px and bottom 380px)
  const MAP = { x: 130, y: 120, width: 780, height: 860 };
  const LEAF_TOP = 1030;
  // The ruler line sits between its two label rows: row 0 below it, row 1 above it.
  const RULER = { x0: 120, x1: 920, y: 1428 };
  const VERSE = 66, SMALL = 30, CITY = 40, TICK = 28;

  // ---- map: sketch geography in faint ink, stations, and the route
  const layers = (recipe.map || []).map(name => GEOGRAPHY[name]).filter(Boolean);
  const project = fitMap([...layers.flat(), ...stations.map(s => s.lonlat)], MAP);
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
  const mapCtx = document.getElementById('map').getContext('2d');
  mapCtx.lineCap = mapCtx.lineJoin = 'round';
  const geo = name => (recipe.map || []).includes(name) ? GEOGRAPHY[name] : null;
  // Lines run as smooth curves through the traced points (midpoint quadratics), not as a polyline.
  const path = (ctx, line) => {
    const pts = line.map(project);
    ctx.beginPath();
    ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    }
    ctx.lineTo(...pts.at(-1));
  };
  // Land in a faint wash, the sea left as paper; the wash fades out toward the map's edges, so the
  // map has no frame.
  if (geo('coast')) {
    const wash = document.createElement('canvas');
    wash.width = W;
    wash.height = H;
    const g = wash.getContext('2d');
    const coast = geo('coast');
    const [w0, e0] = [coast[0], coast.at(-1)];
    path(g, [...coast, [e0[0] + 3, e0[1]], [e0[0] + 3, 40], [w0[0] - 3, 40], [w0[0] - 3, w0[1]]]);
    g.fillStyle = rgba(colors.ink, 0.05);
    g.fill();
    if (geo('hainan')) { path(g, geo('hainan')); g.fill(); }
    // An ellipse spanning the coast's two ends: the wash is gone by the time the traced coast ends.
    const xw = project(w0)[0], xe = project(e0)[0];
    const cx = (xw + xe) / 2, cy = MAP.y + MAP.height * 0.45, rx = (xe - xw) / 2, ry = MAP.height * 0.62;
    g.globalCompositeOperation = 'destination-in';
    g.save();
    g.translate(cx, cy);
    g.scale(rx / ry, 1);
    const fade = g.createRadialGradient(0, 0, 0, 0, 0, ry);
    fade.addColorStop(0, 'rgba(0,0,0,1)');
    fade.addColorStop(0.6, 'rgba(0,0,0,1)');
    fade.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = fade;
    g.fillRect(-ry * 2, -ry * 2, ry * 4, ry * 4);
    g.restore();
    mapCtx.drawImage(wash, 0, 0);
  }
  const strokes = { yangtze: [3, 0.42], gan: [2.2, 0.32], beijiang: [2.2, 0.32], coast: [2.4, 0.36], hainan: [2, 0.36] };
  for (const [name, [width, alpha]] of Object.entries(strokes)) {
    if (!geo(name)) continue;
    path(mapCtx, geo(name));
    mapCtx.strokeStyle = rgba(colors.ink, alpha);
    mapCtx.lineWidth = width;
    mapCtx.stroke();
  }
  // Peaks as old-map glyphs: a pair of brush arcs with a light wash inside.
  for (const peak of geo('peaks') || []) {
    const [x, y] = project(peak);
    for (const [dx, size] of [[-9, 0.7], [5, 1]]) {
      const s = 17 * size;
      mapCtx.beginPath();
      mapCtx.moveTo(x + dx - s, y + 5);
      mapCtx.quadraticCurveTo(x + dx - s * 0.35, y - s * 0.3, x + dx, y - s * 0.9);
      mapCtx.quadraticCurveTo(x + dx + s * 0.35, y - s * 0.3, x + dx + s, y + 5);
      mapCtx.fillStyle = rgba(colors.ink, 0.06);
      mapCtx.fill();
      mapCtx.strokeStyle = rgba(colors.ink, 0.48);
      mapCtx.lineWidth = 2;
      mapCtx.stroke();
    }
  }
  const route = routePath(stations.map(s => s.lonlat), recipe.bends, project);
  const nodes = stations.map(s => project(s.lonlat));

  // ---- text: city names on the map, one inscription per station, the timeline
  const typeLayer = document.getElementById('type');
  const el = (tag, className, parent, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    parent.appendChild(node);
    return node;
  };
  const cities = stations.map((s, i) => {
    const [x, y] = nodes[i];
    const label = el('div', 'city', typeLayer, s.place);
    label.style.cssText = `left:${x + 22}px;top:${y}px;font-size:${CITY}px`;
    return label;
  });

  const pt = W / 393;
  const leaves = stations.map((s, i) => {
    const leaf = el('div', 'leaf', typeLayer);
    leaf.style.top = `${LEAF_TOP}px`;
    const verse = el('div', 'verse', leaf);
    verse.style.cssText = `font-size:${VERSE}px;line-height:${VERSE * 1.3}px`;
    const glyphs = [];
    for (const line of s.verse) {
      const row = el('div', '', verse);
      for (const ch of huapingClauses(line).join('')) glyphs.push(el('span', '', row, ch));
    }
    const source = el('div', 'source', leaf);
    source.style.cssText = `font-size:${SMALL}px;line-height:${SMALL * 1.6}px;margin-top:${SMALL * 0.6}px`;
    el('span', 'author', source, byline(recipe.dynasty, recipe.poet));
    el('span', '', source, `《${s.poem}》　${s.written}`);
    const context = el('div', 'context', leaf, `${s.place}　${s.years} · ${s.span}`);
    context.style.cssText = `font-size:${SMALL}px;line-height:${SMALL * 1.6}px`;
    // Glyphs ink in over two seconds from arrival; the credit lines follow.
    const start = s.t0 + 0.35;
    const times = glyphs.map((_, j) => start + j * Math.min(0.14, 2.0 / glyphs.length));
    const next = stations[i + 1];
    return { leaf, glyphs, times, extra: [source, context], extraAt: times.at(-1) + 0.25, out: next ? next.t0 + 0.15 : Infinity };
  });

  // Timeline: true positions for the ticks, labels in up to two rows that never overlap.
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `${TICK}px SongReg`;
  const widths = events.map(e => Math.max(measure.measureText(String(e.year)).width, measure.measureText(e.text).width * 1.1) + 8);
  const ruler = rulerLayout(events, { x0: RULER.x0, x1: RULER.x1, widths });
  window.WARNINGS = ruler.filter(r => r.left < RULER.x0 - 0.5 || r.right > RULER.x1 + 0.5).map(r => `刻度 ${r.year} 越界`);
  const ticks = ruler.map(r => {
    const tick = el('div', 'tick', typeLayer);
    const labelHeight = TICK * 1.35 * 2;
    tick.style.cssText = `left:${r.center}px;top:${r.row ? RULER.y - 16 - labelHeight : RULER.y + 16}px;font-size:${TICK}px`;
    el('div', 'year', tick, String(r.year));
    el('div', 'event', tick, r.text);
    return tick;
  });
  // Ticks, leader lines and the ruler line itself are drawn on the map canvas (they do not move).
  mapCtx.strokeStyle = colors.rule;
  mapCtx.lineWidth = 2;
  mapCtx.beginPath();
  mapCtx.moveTo(RULER.x0, RULER.y);
  mapCtx.lineTo(RULER.x1, RULER.y);
  mapCtx.stroke();
  mapCtx.strokeStyle = rgba(colors.ink, 0.35);
  mapCtx.lineWidth = 1.4;
  for (const r of ruler) {
    // A short tick on the line toward its label; a shifted label gets a short leader to its tick.
    const side = r.row ? -1 : 1;
    mapCtx.beginPath();
    mapCtx.moveTo(r.tick, RULER.y);
    mapCtx.lineTo(r.tick, RULER.y + side * 8);
    if (Math.abs(r.center - r.tick) > 4) mapCtx.lineTo(r.center, RULER.y + side * 14);
    mapCtx.stroke();
  }

  // ---- timeline of the clip
  const stationAt = t => Math.max(0, stations.findLastIndex(s => t >= s.t0));
  const reach = i => route.stops[i];
  // The route grows into each station over the 1.2s before it is named.
  const routeAt = t => {
    let f = 0;
    for (let i = 1; i < stations.length; i++) {
      const p = easeInOut(clamp((t - (stations[i].t0 - 0.9)) / 1.2));
      if (p > 0) f = reach(i - 1) + (reach(i) - reach(i - 1)) * p;
    }
    return f;
  };
  window.EV = [
    { t: 0.2, sfx: 'qin-harmonic', gain: -8 },
    ...stations.map((s, i) => ({ t: Number((s.t0 + 0.35).toFixed(2)), sfx: i ? 'page-turn' : 'ink-drop', gain: -7 })),
  ];
  window.TEXTS = t => {
    const list = [];
    leaves.forEach((l, i) => {
      if (t >= l.times[0] + 0.125 && t < l.out - 0.3) list.push({ id: `station-${i + 1}`, text: stations[i].verse.join('，') });
    });
    return list;
  };

  const routeCtx = document.getElementById('route').getContext('2d');
  const artWrap = document.getElementById('art-wrap');
  const ink = (node, s, gone = 0) => {
    const blur = s.blur + gone * 12;
    node.style.opacity = (s.opacity * (1 - gone)).toFixed(3);
    node.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  };

  window.render = t => {
    t = Math.max(0, Math.min(window.DUR, t));
    artWrap.style.transform = `scale(${pushScale(t, window.DUR).toFixed(5)})`;
    const current = stationAt(t);

    // Route in seal colour, a soft wet edge under a firm line; nodes in ink; ripples at the current city.
    routeCtx.clearRect(0, 0, W, H);
    routeCtx.lineCap = routeCtx.lineJoin = 'round';
    const drawn = routeUpTo(route, routeAt(t));
    for (const [width, alpha] of [[12, 0.16], [5, 0.92]]) {
      routeCtx.strokeStyle = rgba(vermilion, alpha);
      routeCtx.lineWidth = width;
      routeCtx.beginPath();
      drawn.forEach(([x, y], i) => (i ? routeCtx.lineTo(x, y) : routeCtx.moveTo(x, y)));
      if (drawn.length > 1) routeCtx.stroke();
    }
    nodes.forEach(([x, y], i) => {
      const shown = easeOut(clamp((t - (stations[i].t0 - (i ? 0.1 : 0.5))) / 0.5));
      if (shown <= 0) return;
      routeCtx.fillStyle = rgba(colors.ink, shown * (i === current ? 0.92 : 0.6));
      routeCtx.beginPath();
      routeCtx.arc(x, y, 8, 0, Math.PI * 2);
      routeCtx.fill();
      if (i === current) {
        for (let k = 0; k < 2; k++) {
          const p = ((t - stations[i].t0) / 2.4 + k / 2) % 1;
          if (t < stations[i].t0) continue;
          routeCtx.strokeStyle = rgba(colors.ink, 0.28 * Math.sin(Math.PI * p) * shown);
          routeCtx.lineWidth = 1.4;
          routeCtx.beginPath();
          routeCtx.ellipse(x, y, 14 + 40 * p, (14 + 40 * p) * 0.42, 0, 0, Math.PI * 2);
          routeCtx.stroke();
        }
      }
      cities[i].style.opacity = shown.toFixed(3);
      cities[i].style.color = i === current ? 'var(--ink)' : 'var(--muted)';
    });
    nodes.forEach((_, i) => { if (t < stations[i].t0 - (i ? 0.1 : 0.5)) cities[i].style.opacity = '0'; });

    leaves.forEach((l, i) => {
      const gone = leafGone(t, l);
      l.leaf.style.visibility = t < l.times[0] || gone >= 1 ? 'hidden' : 'visible';
      l.glyphs.forEach((g, j) => ink(g, inkGlyphState(t, l.times[j], 0.25, pt), gone));
      l.extra.forEach(node => ink(node, inkGlyphState(t, l.extraAt, 0.3, pt), gone));
    });

    ticks.forEach((tick, i) => {
      const on = ruler[i].station === current;
      tick.querySelector('.year').style.color = on ? 'var(--ink)' : 'var(--muted)';
      tick.style.opacity = on ? '1' : '0.55';
    });
  };

  window.render(0);
  window.READY = true;
  previewLoop(document.getElementById('stage'), params);
</script>
</body>
</html>
