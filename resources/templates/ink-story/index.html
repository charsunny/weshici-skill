<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1920,initial-scale=1" />
<link rel="icon" href="data:,">
<title>微诗 · 写意水墨叙事 (ink-story)</title>
<link rel="stylesheet" href="/resources/core/huaping-video.css">
<style>
  /* One inscription at a time: the title page, then each couplet, all in the same verse box. */
  .leaf { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="stage">
    <div id="art-wrap">
      <canvas id="art"></canvas>
      <canvas id="weather" width="1080" height="1920"></canvas>
    </div>
    <div id="type"></div>
  </div>

<script src="/vendor/zxart/zxart-compose.js"></script>
<script src="/vendor/zxart/zxart-shanshui-v5.js"></script>
<script type="module">
  import { huapingClauses, huapingPlan, mountHuaping } from '/resources/core/huaping-layout.js';
  import {
    TYPE_FLOOR, typeFloorIssues, inkGlyphState, sealState, pushScale, storyTimeline, leafGone, readableWindow,
  } from '/resources/core/huaping-video.js';
  import { loadRecipe, planPainting, applyPalette, paintFrame, afterglowScene, tintSeals, previewLoop } from '/resources/core/huaping-scene.js';
  import { drawAfterglow } from '/resources/core/huaping-afterglow.js';

  // Ink-wash story: the painting is the subject; the title page and then each couplet are inscribed,
  // one at a time, in the painting's open sky, and dissolve like ink into water before the next.
  const W = 1080, H = 1920;
  const { params, recipe, palettes } = await loadRecipe('wanqing-dufu-story');
  window.RECIPE = recipe;
  const { title = '', author = '', dynasty = '' } = recipe;

  // Couplets carry the reading's line timestamps; a silent recipe is paced at 0.3s per character.
  let couplets = (recipe.couplets || []).map(c => ({ start: Number(c.start), end: Number(c.end), text: c.text }));
  if (!couplets.length) {
    let t = 1.6;
    couplets = (recipe.lines || []).map(text => {
      const span = Math.max(2.4, huapingClauses(text).join('').length * 0.3 + 1.2);
      const c = { start: t, end: t + span, text };
      t += span;
      return c;
    });
  }
  couplets = couplets.filter(c => huapingClauses(c.text).length);
  if (!couplets.length) throw new Error('配方缺少 couplets 或 lines');
  const poem = couplets.map(c => c.text).join('');
  const allClauses = couplets.flatMap(c => huapingClauses(c.text));
  const longest = Math.max(...allClauses.map(line => Array.from(line).length));

  const painting = planPainting({ poem, title, procedural: recipe.procedural, params, verseSide: 'right',
    verseColumns: Math.min(4, Math.max(...couplets.map(c => huapingClauses(c.text).length))),
    verseChars: longest });
  const palette = applyPalette(palettes, recipe, params, painting);
  await document.fonts.load('100px SongReg');
  await document.fonts.ready;
  const frame = await paintFrame(document.getElementById('art'), painting, palette, { width: W, height: H });

  // Every couplet shares one size, the largest that fits the longest of them, with the colophon's room.
  const floor = TYPE_FLOOR.small * W / 1080;
  const common = Math.min(...couplets.map(c => huapingPlan({ poem: c.text, title, author, dynasty,
    verse: frame.verse, width: W, height: H, minInscription: floor }).fontSize));
  const typeLayer = document.getElementById('type');
  const leaf = () => {
    const el = document.createElement('div');
    el.className = 'leaf';
    typeLayer.appendChild(el);
    return el;
  };

  // Title page: the poem's title as the inscription, the byline beside it; the seal waits for the end.
  const titleLeaf = leaf();
  const titlePlan = await mountHuaping(titleLeaf, { poem: title, title: '', author, dynasty, verse: frame.verse,
    width: W, height: H, accent: palette.colors.accent, minInscription: floor });
  titleLeaf.querySelector('img.hp-seal')?.remove();

  const leaves = [];
  for (const [i, c] of couplets.entries()) {
    const el = leaf();
    const last = i === couplets.length - 1;
    // Only the last couplet carries the colophon (title, byline) and the seal.
    const plan = await mountHuaping(el, { poem: c.text, title: last ? title : '', author: last ? author : '',
      dynasty: last ? dynasty : '', verse: frame.verse, width: W, height: H, accent: palette.colors.accent,
      preferredSize: common, minInscription: floor });
    if (!last) el.querySelector('.hp-colophon')?.remove();
    leaves.push({ el, plan, glyphs: [...el.querySelectorAll('.hp-verses .hp-glyph')],
      colophon: last ? el.querySelector('.hp-colophon') : null });
  }
  const seal = tintSeals(leaves.at(-1).el);
  const issues = [...leaves.flatMap(l => typeFloorIssues(l.plan, W)), ...typeFloorIssues(titlePlan, W)]
    .concat(leaves.flatMap(l => l.plan.omittedClauses.length ? [`未展示的诗句：${l.plan.omittedClauses.join('，')}`] : []));
  window.WARNINGS = [...new Set(issues)];
  window.WARNINGS.forEach(issue => console.warn(issue));

  // Glyphs follow the reading's line timestamps; leaves dissolve like ink into water between lines.
  const pt = W / 393;
  const titleGlyphs = [...titleLeaf.querySelectorAll('.hp-verses .hp-glyph')];
  const titleColophon = titleLeaf.querySelector('.hp-colophon');
  const story = storyTimeline({ couplets, glyphCounts: leaves.map(l => l.glyphs.length), titleGlyphs: titleGlyphs.length });
  window.DUR = Number(params.get('dur')) || Math.max(Math.ceil(Number(recipe.duration) || 0), Math.ceil(story.sealAt + 4));

  window.EV = [
    { t: 0.12, sfx: 'qin-harmonic', gain: -8 },
    ...couplets.map(c => ({ t: Number(c.start.toFixed(2)), sfx: 'ink-drop', gain: -9.5 })),
    { t: Number(story.sealAt.toFixed(2)), sfx: 'seal-stamp', gain: -4 },
  ];

  const readable = (t, leaf) => {
    const [from, to] = readableWindow(leaf, story.dissolve);
    return t >= from && t < to;
  };
  window.TEXTS = t => {
    const list = [];
    if (readable(t, story.title)) list.push({ id: 'title', text: [title, titlePlan.attribution].filter(Boolean).join(' ') });
    story.lines.forEach((line, i) => { if (readable(t, line)) list.push({ id: `couplet-${i + 1}`, text: couplets[i].text }); });
    return list;
  };

  const scene = afterglowScene(frame, palette, { poem, title, term: recipe.term, motifs: painting.motifs,
    avoid: leaves.at(-1).plan.box, seed: painting.art.seed, duration: window.DUR });
  window.SCENE = { scene: painting.scene, composition: painting.art.params.scene.composition, motifs: painting.motifs,
    palette: `${palette.id}/${palette.appearance}`, artHeight: frame.artHeight, weather: scene.weather,
    afterglow: scene.afterglow, box: leaves.at(-1).plan.box, fontSize: common };
  const weatherCtx = document.getElementById('weather').getContext('2d');
  const artWrap = document.getElementById('art-wrap');

  const ink = (el, state, gone = 0, blurScale = 1) => {
    const blur = state.blur * blurScale + gone * 14;
    el.style.opacity = (state.opacity * (1 - gone)).toFixed(3);
    el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    el.style.transform = `scale(${(state.scale + gone * 0.04).toFixed(4)})`;
  };
  const rest = { opacity: 1, blur: 0, scale: 1 };

  window.render = t => {
    t = Math.max(0, Math.min(window.DUR, t));
    artWrap.style.transform = `scale(${pushScale(t, window.DUR).toFixed(5)})`;
    drawAfterglow(weatherCtx, t, scene);

    const titleGone = leafGone(t, story.title, story.dissolve);
    titleLeaf.style.visibility = titleGone >= 1 ? 'hidden' : 'visible';
    ink(titleLeaf, rest, titleGone);
    titleGlyphs.forEach((g, i) => ink(g, inkGlyphState(t, story.title.times[i], 0.25, pt)));
    if (titleColophon) ink(titleColophon, inkGlyphState(t, story.titleColophonAt, 0.18, pt), 0, 0.5);

    leaves.forEach((l, i) => {
      const line = story.lines[i];
      const gone = leafGone(t, line, story.dissolve);
      l.el.style.visibility = t < line.times[0] || gone >= 1 ? 'hidden' : 'visible';
      ink(l.el, rest, gone);
      l.glyphs.forEach((g, j) => ink(g, inkGlyphState(t, line.times[j], 0.25, pt)));
    });
    const last = leaves.at(-1);
    if (last.colophon) ink(last.colophon, inkGlyphState(t, story.colophonAt, 0.18, pt), 0, 0.5);
    const s = sealState(t, story.sealAt);
    seal.style.opacity = s.opacity.toFixed(3);
    seal.style.transform = `scale(${s.scale.toFixed(4)})`;
  };

  window.render(0);
  window.READY = true;
  previewLoop(document.getElementById('stage'), params);
</script>
</body>
</html>
