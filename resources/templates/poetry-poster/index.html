<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>微诗 · 诗词海报</title>
<style>
  @font-face { font-family: Song; src: url('/resources/assets/fonts/SourceHanSerifSC-Regular.otf'); }
  @font-face { font-family: Song; src: url('/resources/assets/fonts/SourceHanSerifSC-Bold.otf'); font-weight: 700; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Song, serif; }
  #stage { position: relative; width: 1080px; height: 1440px; overflow: hidden; background: var(--paper); color: var(--ink); }
  canvas { position: absolute; inset: 0; }

  /* Three levels only: verse / subtitle and source / footer. */
  .type { position: absolute; left: 88px; right: 88px; top: 150px; }
  .verse { margin: 0; font-weight: 700; line-height: 1.38; letter-spacing: .04em; }
  .verse span { display: block; white-space: nowrap; }
  .subtitle { margin: 34px 0 0; font-size: 32px; line-height: 1.7; letter-spacing: .16em; color: var(--muted); }
  .source { margin: 26px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; font-size: 32px; letter-spacing: .14em; color: var(--muted); }
  .source .author { color: var(--accent); }
  .seal { display: block; flex: none; width: 36px; height: 74px; background: var(--seal);
    -webkit-mask: url('/resources/assets/huaping/jianyang-seal.png') center / contain no-repeat;
    mask: url('/resources/assets/huaping/jianyang-seal.png') center / contain no-repeat; }

  .cover .verse { line-height: 1.1; letter-spacing: .14em; }
  .cover .subtitle { margin-top: 40px; font-size: 38px; line-height: 1.75; letter-spacing: .2em; }

  .vertical .type { left: auto; right: 96px; display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 46px; }
  .vertical .verse { display: flex; flex-direction: row-reverse; gap: .34em; line-height: 1; letter-spacing: .14em; }
  .vertical .verse span { writing-mode: vertical-rl; }
  .vertical .source { order: 1; margin: 2.6em 0 0; writing-mode: vertical-rl; gap: 18px; }
  .vertical .subtitle { order: 2; margin: 5.2em -20px 0 0; writing-mode: vertical-rl; font-size: 30px; }

  .footer { position: absolute; left: 88px; right: 88px; bottom: 58px; height: 120px; display: flex; align-items: center; gap: 22px; }
  .brand { writing-mode: vertical-rl; font-size: 30px; font-weight: 700; letter-spacing: .28em; line-height: 1; }
  .qr { flex: none; width: 120px; height: 120px; padding: 8px; background: var(--qr-tile); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .qr svg rect { fill: transparent; }
  .qr svg path { fill: var(--qr-ink); }
  .calendar { font-size: 26px; line-height: 1.62; letter-spacing: .06em; }
  .calendar .tag { color: var(--muted); }
  .series { margin-left: auto; text-align: right; font-size: 26px; line-height: 1.62; letter-spacing: .18em; color: var(--muted); }
</style>
<div id="stage"><canvas id="art" width="1080" height="1440"></canvas><div id="type"></div></div>
<script src="/resources/vendor/qrcode/qrcode.js"></script>
<script type="module" src="./poster.js"></script>
</html>
