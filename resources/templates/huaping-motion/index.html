<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1920,initial-scale=1" />
<link rel="icon" href="data:,">
<title>微诗 · 动态画屏 (huaping-motion)</title>
<style>
  @font-face {
    font-family: "SongReg";
    src: url("/resources/assets/fonts/SourceHanSerifSC-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: "SongReg", serif; -webkit-font-smoothing: antialiased; }

  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    transform-origin: top left;
    background: var(--paper);
    color: var(--ink);
  }

  /* The painting and its weather push together (≤ 2%); the text layer never scales. */
  #art-wrap { position: absolute; inset: 0; transform-origin: 50% 60%; }
  #art-wrap canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #type { position: absolute; inset: 0; }

  /* Same verse box and colophon as the static huaping image (huaping-layout.js). */
  .hp-box { position: absolute; display: flex; justify-content: center; align-items: flex-start; }
  .hp-block { display: flex; align-items: flex-end; flex: none; font-weight: 400; }
  .hp-columns { display: flex; flex-direction: row-reverse; align-items: flex-start; flex: none; }
  .hp-column { position: relative; flex: none; }
  .hp-glyph { position: absolute; width: 100%; text-align: center; white-space: pre; }
  .hp-colophon, .hp-author-seal { display: flex; flex-direction: column; align-items: center; flex: none; }
  .hp-colophon-wide { flex-direction: row; align-items: flex-end; }
  .hp-title { color: var(--muted); }
  .hp-horizontal { flex-direction: column; align-items: center; align-self: center; width: 100%; }
  .hp-line { line-height: 1.82; letter-spacing: .14em; white-space: nowrap; }
  .hp-footer { display: flex; align-items: center; justify-content: center; gap: .6em; margin-top: .5em; max-width: 100%; color: var(--muted); }
  /* The App's vertical seal, tinted with the palette's seal colour: the only red in the frame. */
  .hp-seal { display: block; flex: none; background: var(--seal);
    -webkit-mask: url('/resources/assets/huaping/jianyang-seal.png') center / contain no-repeat;
    mask: url('/resources/assets/huaping/jianyang-seal.png') center / contain no-repeat; }
</style>
</head>
<body>
  <div id="stage">
    <div id="art-wrap">
      <canvas id="art"></canvas>
      <canvas id="weather"></canvas>
    </div>
    <div id="type"></div>
  </div>

<script src="/vendor/zxart/zxart-compose.js"></script>
<script src="/vendor/zxart/zxart-shanshui-v5.js"></script>
<script type="module">
  import { renderZXArt } from '/resources/core/weishi-video-core.js';
  import { huapingClauses, huapingPlan, mountHuaping } from '/resources/core/huaping-layout.js';
  import {
    resolveVideoPalette, clipVerseRect, TYPE_FLOOR, typeFloorIssues, inkRevealPlan, inkGlyphState, sealState,
    videoDuration, pushScale, pickWeather, geeseCount, afterglowPlan,
  } from '/resources/core/huaping-video.js';
  import { drawAfterglow } from '/resources/core/huaping-afterglow.js';

  const W = 1080, H = 1920;
  const params = new URLSearchParams(location.search);
  const recipe = await (await fetch(`/resources/recipes/${params.get('recipe') || 'hanlu-dufu'}.json`)).json();
  const palettes = await (await fetch('/resources/core/app-palettes.json')).json();
  window.RECIPE = recipe;

  // Poem and attribution come only from the recipe; an unknown dynasty is simply left out.
  const lines = recipe.lines || [];
  const poem = lines.join('，');
  const title = recipe.title || '';
  const author = recipe.author || '';
  const dynasty = recipe.dynasty || '';
  const clauses = huapingClauses(poem);
  if (!clauses.length) throw new Error('配方缺少诗句 lines');

  // ShanShui@5: the engine decides purpose, composition and motifs from the poem; the recipe keeps its seed.
  const matched = window.poetryScene(poem, title);
  const proc = recipe.procedural || {};
  if (proc.generator !== 'shanshui@5') throw new Error(`huaping-motion 需要 shanshui@5 配方，当前为 ${proc.generator}`);
  const longest = Math.max(...clauses.map(line => Array.from(line).length));
  const art = matched.paintingProcedural(proc.seed, {
    purpose: 'inscription-v1',
    quietTop: proc.quietTop ?? 0.18,
    verseSide: proc.verseSide || 'left',
    verseColumns: Math.min(4, clauses.length),
    verseChars: longest >= 6 && longest <= 8 ? Math.min(10, longest + 2) : longest,
  });
  const motifs = art.params.scene.motifs;

  const palette = resolveVideoPalette(palettes, {
    palette: params.get('palette') || recipe.palette,
    appearance: params.get('appearance') || recipe.appearance,
    term: recipe.term,
    date: recipe.date,
    night: motifs.includes('moon') || motifs.includes('crescent') || matched.scene === 'moonNight',
  });
  const stage = document.getElementById('stage');
  for (const [slot, value] of Object.entries(palette.colors)) document.documentElement.style.setProperty(`--${slot}`, value);

  await document.fonts.load('100px SongReg');
  await document.fonts.ready;

  const artCanvas = document.getElementById('art');
  const painted = await renderZXArt(artCanvas, {
    generator: 'shanshui@5', seed: art.seed, scene: matched.scene, params: art.params,
    palette: { paper: palette.colors.paper, ink: palette.colors.ink }, width: W, height: H,
  });
  // A fallback drawing is a failure, not a finished painting.
  if (!painted.ok) throw new Error(`画屏渲染失败（${painted.error || 'fallback'}），不能用简化山水代替`);

  // Text follows the engine's verse box, clipped out of the platform's right and bottom controls.
  const verse = { ...painted.verse, rect: clipVerseRect(painted.verse.rect, { width: W, height: H }) };
  let preferredSize = Infinity;
  if (longest >= 6 && longest <= 8) {
    const reference = window.ZXArtCompose.verseLayoutFor('shanshui@5', { ...art.params, verse_chars: 5 }, W, H);
    reference.rect = clipVerseRect(reference.rect, { width: W, height: H });
    preferredSize = huapingPlan({ poem: clauses.map(line => Array.from(line).slice(0, 5).join('')).join('，'),
      title, author, dynasty, verse: reference, width: W, height: H }).fontSize;
  }
  const typeLayer = document.getElementById('type');
  const plan = await mountHuaping(typeLayer, { poem, title, author, dynasty, verse, width: W, height: H,
    accent: palette.colors.accent, preferredSize, minInscription: TYPE_FLOOR.small * W / 1080 });
  window.__huapingPlan = plan;
  const issues = typeFloorIssues(plan, W);
  if (plan.omittedClauses.length) issues.push(`未展示的诗句：${plan.omittedClauses.join('，')}`);
  window.WARNINGS = issues;
  issues.forEach(issue => console.warn(issue));

  // The App seal image becomes a mask so it takes the palette's seal colour.
  const sealImg = typeLayer.querySelector('img.hp-seal');
  const seal = document.createElement('i');
  seal.className = 'hp-seal';
  seal.setAttribute('aria-label', '微詩');
  seal.style.width = sealImg.style.width;
  seal.style.height = sealImg.style.height;
  sealImg.replaceWith(seal);

  const glyphs = [...typeLayer.querySelectorAll(plan.vertical ? '.hp-verses .hp-glyph' : '.hp-line')];
  const colophon = typeLayer.querySelector(plan.vertical ? '.hp-colophon' : '.hp-credit');
  const reveal = inkRevealPlan({ count: glyphs.length });
  const pt = W / 393;
  const shown = plan.clauses.join('').length;
  // A recipe with a reading must also hold the whole recording, not just the silent-reading hold.
  window.DUR = Number(params.get('dur')) || Math.max(videoDuration(shown, reveal.settle), recipe.voice ? Math.ceil(recipe.duration || 0) : 0);

  window.EV = [
    { t: 0.12, sfx: 'qin-harmonic', gain: -8 },
    { t: reveal.starts[0], sfx: 'ink-drop', gain: -9 },
    { t: Number(reveal.sealStart.toFixed(2)), sfx: 'seal-stamp', gain: -3.5 },
  ];

  const midGlyph = reveal.starts[Math.floor(glyphs.length / 2)];
  window.TEXTS = t => {
    const visible = [];
    if (t >= midGlyph) visible.push({ id: 'poem-verse', text: plan.clauses.join('，') });
    if (t >= reveal.colophonStart + reveal.colophonDuration * 0.5) visible.push({ id: 'colophon', text: [title, plan.attribution].filter(Boolean).join(' ') });
    return visible;
  };

  // Weather only from what the painting really has; motion keeps clear of the verse box.
  const avoid = { x: plan.box.x, y: plan.box.y, width: plan.box.width, height: plan.box.height };
  const weatherCanvas = document.getElementById('weather');
  weatherCanvas.width = W;
  weatherCanvas.height = H;
  const weatherCtx = weatherCanvas.getContext('2d');
  // A ripple needs bare water under it: sample the painting around the spot and skip anything inked.
  const pixels = artCanvas.getContext('2d').getImageData(0, 0, W, H).data;
  const paperRgb = [1, 3, 5].map(i => parseInt(palette.colors.paper.slice(i, i + 2), 16));
  const open = (nx, ny) => {
    let inked = 0, total = 0;
    for (let y = Math.round(ny * H - 12); y <= ny * H + 12; y += 3) {
      for (let x = Math.round(nx * W - 44); x <= nx * W + 44; x += 4) {
        if (x < 0 || y < 0 || x >= W || y >= H) return false;
        const i = (y * W + x) * 4;
        total++;
        if (Math.hypot(pixels[i] - paperRgb[0], pixels[i + 1] - paperRgb[1], pixels[i + 2] - paperRgb[2]) > 36) inked++;
      }
    }
    return inked / total < 0.1;
  };
  // Ink density along a row, outside the verse box: where the mountains are.
  const rowInk = ny => {
    let inked = 0, total = 0;
    const y = Math.round(ny * H);
    for (let x = 0; x < W; x += 6) {
      if (x >= avoid.x && x <= avoid.x + avoid.width && y >= avoid.y && y <= avoid.y + avoid.height) continue;
      const i = (y * W + x) * 4;
      total++;
      if (Math.hypot(pixels[i] - paperRgb[0], pixels[i + 1] - paperRgb[1], pixels[i + 2] - paperRgb[2]) > 24) inked++;
    }
    return total ? inked / total : 0;
  };
  const scene = {
    width: W, height: H, colors: palette.colors, appearance: palette.appearance,
    cinnabar: palettes.palettes[palette.id].light.seal,
    weather: pickWeather({ text: (recipe.fullLines || lines).join(''), title, term: recipe.term, motifs }),
    afterglow: afterglowPlan({ anchors: painted.anchors, seed: art.seed, open, rowInk,
      avoid: { x: avoid.x / W, y: avoid.y / H, width: avoid.width / W, height: avoid.height / H } }),
    anchors: painted.anchors, avoid, seed: art.seed, duration: window.DUR,
    geese: geeseCount(lines.join('')),
  };
  window.SCENE = { scene: matched.scene, motifs, palette: `${palette.id}/${palette.appearance}`,
    weather: scene.weather, afterglow: scene.afterglow, anchors: painted.anchors, plan: { box: plan.box, fontSize: plan.fontSize, inscriptionSize: plan.inscriptionSize } };
  const artWrap = document.getElementById('art-wrap');

  window.render = t => {
    t = Math.max(0, Math.min(window.DUR, t));
    artWrap.style.transform = `scale(${pushScale(t, window.DUR).toFixed(5)})`;
    drawAfterglow(weatherCtx, t, scene);
    glyphs.forEach((glyph, i) => {
      const s = inkGlyphState(t, reveal.starts[i], reveal.unit, pt);
      glyph.style.opacity = s.opacity.toFixed(3);
      glyph.style.filter = s.blur > 0.05 ? `blur(${s.blur.toFixed(2)}px)` : 'none';
      glyph.style.transform = `scale(${s.scale.toFixed(4)})`;
    });
    if (colophon) {
      const c = inkGlyphState(t, reveal.colophonStart, reveal.colophonDuration, pt);
      colophon.style.opacity = c.opacity.toFixed(3);
      colophon.style.filter = c.blur > 0.05 ? `blur(${(c.blur * 0.5).toFixed(2)}px)` : 'none';
    }
    const s = sealState(t, reveal.sealStart, reveal.sealDuration);
    seal.style.opacity = s.opacity.toFixed(3);
    seal.style.transform = `scale(${s.scale.toFixed(4)})`;
  };

  function fitViewport() {
    if (params.has('capture')) return;
    const k = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
  }
  addEventListener('resize', fitViewport);
  fitViewport();

  window.render(0);
  window.READY = true;

  // Opened directly in a browser: loop the clip for preview.
  if (!params.has('capture') && window.parent === window) {
    const t0 = performance.now();
    const tick = now => { window.render(((now - t0) / 1000) % window.DUR); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
